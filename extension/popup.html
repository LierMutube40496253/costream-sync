<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Co-stream Sync</title>
<style>
  :root { --bg: #16171b; --fg: #e9eaee; --muted: #9a9fab; --line: #2e3138; --ok: #3ccf7a; --warn: #f2b33d; --discord: #5865f2; }
  @media (prefers-color-scheme: light) { :root { --bg: #fff; --fg: #16171b; --muted: #636978; --line: #e1e3e8; } }
  body { margin: 0; width: 260px; padding: 14px; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); }
  .muted { color: var(--muted); }
  button { width: 100%; margin-top: 10px; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: transparent;
           color: var(--fg); font: inherit; cursor: pointer; }
  button.discord { background: var(--discord); border-color: var(--discord); color: #fff; font-weight: 600; }
  #error { color: #ff6b6b; margin-top: 8px; }
</style>
</head>
<body>
  <h1>Co-stream Sync</h1>
  <div id="loggedout" hidden>
    <div class="muted">Log in with the Discord account you use in the voice channel.</div>
    <button id="login" class="discord">Log in with Discord</button>
  </div>
  <div id="loggedin" hidden>
    <div class="row"><span class="muted">Logged in as</span><strong id="name"></strong></div>
    <div class="row"><span id="dot" class="dot"></span><span id="conn"></span></div>
    <button id="logout">Log out</button>
  </div>
  <div id="error"></div>
  <script src="popup.js"></script>
</body>
</html>
